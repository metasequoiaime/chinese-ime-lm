name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ fromJSON('{"ubuntu-24.04":"depot-ubuntu-24.04-4","windows-2025":"depot-windows-2025-8"}')[matrix.os] }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install corpus and n-gram dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q corpus ngram
      - name: Test corpus cleaning with a synthetic corpus
        run: python -m unittest discover -s tests -v
