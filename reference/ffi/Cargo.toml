[package]
name = "chinese-ime-lm-ffi"
version = "0.1.0"
edition = "2021"
# The same floor as chinese-ime-lm itself: an input method that can build the model crate must be able to build its C ABI too.
rust-version = "1.75"
license = "Apache-2.0"
description = "C ABI for chinese-ime-lm, a character-level language model for reranking Chinese input method candidates"
readme = "README.md"
repository = "https://github.com/metasequoiaime/chinese-ime-lm"
keywords = ["chinese", "input-method", "pinyin", "ffi"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
# staticlib and cdylib are what C, C++, Swift and JNI hosts link; rlib lets this crate's own tests call the exported functions directly.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chinese-ime-lm = { path = "..", version = "0.2" }

[dev-dependencies]
# Builds the test model's safetensors header. Already in the graph through chinese-ime-lm, so this adds no crate.
serde_json = "1"

[lints.rust]
# Every exported function is `unsafe extern "C"`; requiring an explicit block for each unsafe operation inside them keeps the places that rely on the caller's promises visible.
unsafe_op_in_unsafe_fn = "deny"
