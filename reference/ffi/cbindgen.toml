# Generates include/chinese_ime_lm.h. The header is committed so that adopters need no Rust tooling to read or vendor it; CI runs `cbindgen --verify` to fail when it no longer matches src/lib.rs.
language = "C"
header = "/* chinese-ime-lm C ABI, Apache-2.0. Generated by cbindgen from reference/ffi/src/lib.rs: do not edit by hand. */"
include_guard = "CHINESE_IME_LM_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]

[export.rename]
"CimelmModel" = "cimelm_model"
"CimelmReranker" = "cimelm_reranker"
"CimelmStr" = "cimelm_str"
"CimelmStatus" = "cimelm_status"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
